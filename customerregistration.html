<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title>
    <link rel="stylesheet" href="fontawesome-free-7.2.0-web/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-wrapper">
        <form action="backend/registration.php"method="post" enctype="multipart/form-data">
            <p>Customer's Registration</p>
            

            <div class="input">
                <i class="fas fa-user"></i>
                <input type="text" name="fname" placeholder="Enter first name"required>
            </div>

            <div class="input">
                <i class="fas fa-users"></i>
                <input type="text" name="lname" placeholder="Enter last name"required>
            </div>

            <div class="input">
                <i class="fas fa-phone"></i>
                <input type="tel" name="phone" placeholder="Enter phone number"required>
            </div>

            
            <div class="input">
                <i class="fas fa-key"></i>
                <input type="password" name="password" placeholder="Enter password"required>
            </div>

            <div class="input">
                <i class="fas fa-image"></i>
                <input type="file" name="image"required>
            </div>

            <button name="submit" type="submit" id="login_btn"><i class="fas fa-database"></i>     Register</button>
        </form>
        <div class="links">
            <p class="link">Already have an account? <a href="customerlogin.html">Login</a></p>
        </div>

    </div>
</body>
</html>
